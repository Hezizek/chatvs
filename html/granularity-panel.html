<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">
    <title>粒度面板</title>
</head>

<body>
    <div id="button-bar-container">

        <!-- Displayed for ongoing modules. -->
        <div id="button-bar-ongoing" class="button-bar-ongoing">
            <button onclick="sendCommand('refinement.globalRefine')">全局精化</button>
            <button onclick="sendCommand('refinement.localRefine')">局部精化</button>
            <button onclick="sendCommand('refinement.rollback')">回退粒度</button>
            <button onclick="sendGenerateCommand()">生成代码</button>
            <select id="language-select" title="选择语言" class="language-select">
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="c++">C++</option>
                <option value="c">C</option>
                <option value="javascript">JavaScript</option>
                <option value="typescript">TypeScript</option>
                <option value="html">HTML</option>
            </select>
        </div>

        <!-- Displayed for completed modules. -->
        <div id="button-bar-completed" class="button-bar-completed">
            <button onclick="sendCommand('refinement.rollback')">回退粒度</button>
        </div>

        <!-- Displayed for granularity 0 (JSON design stage). -->
        <div id="button-bar-granularity0" class="button-bar-granularity0">
            <button onclick="sendCommand('refinement.json2pse')">自然语言json转伪代码</button>
        </div>

        <!-- Displayed for pending modules. -->
        <div id="button-bar-pending" class="button-bar-pending">
            Refinement panel is currently disabled.
        </div>
    </div>

    <div class="module-container">
        <div class="chain-title">模块顺序</div>
        <div class="module-chain" id="module-chain-root"></div>
    </div>

    <div class="granularity-container">
        <div class="chain-title">粒度历史</div>
        <div class="granularity-chain" id="chain-root"></div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const chainRoot = document.getElementById('chain-root');

        // [新增] 获取模块容器 DOM
        const moduleChainRoot = document.getElementById('module-chain-root');

        // [新增] 获取 button bar 容器 DOM 以控制显示
        const buttonBarOngoing = document.getElementById('button-bar-ongoing');
        const buttonBarCompleted = document.getElementById('button-bar-completed');
        const buttonBarGranularity0 = document.getElementById('button-bar-granularity0');
        const buttonBarPending = document.getElementById('button-bar-pending');

        function sendCommand(commandId) {
            vscode.postMessage({ type: 'executeCommand', commandId: commandId });
        }

        // 专门用于发送生成代码命令的函数，携带语言参数
        function sendGenerateCommand() {
            const select = document.getElementById('language-select');
            const language = select.value;
            vscode.postMessage({
                type: 'executeCommand',
                commandId: 'refinement.generateCode',
                payload: { language: language }
            });
        }

        window.addEventListener('message', event => {
            const msg = event.data;
            switch (msg.type) {
                case 'updateView':
                    const { nodes, moduleSequence, currentModule, moduleStatus, currentGranularity } = msg.data;
                    renderButtonBar(nodes, moduleStatus, currentGranularity);  // 根据模块状态和当前粒度判断显示哪个按钮组
                    renderChain(nodes);                                 // 渲染粒度历史
                    renderModuleChain(moduleSequence, currentModule);   // 渲染模块顺序
                    break;
                default:
                    console.error(`Invalid message type from backend: ${msg.type}`);
            }
        });

        // [新增] 渲染模块顺序链表的函数
        function renderModuleChain(sequence, currentModule) {
            moduleChainRoot.innerHTML = '';

            if (!sequence || sequence.length === 0) {
                moduleChainRoot.innerHTML = '<span style="color:var(--vscode-descriptionForeground); font-size:0.9em;">(无 seq.json 配置)</span>';
                return;
            }

            sequence.forEach((moduleName, index) => {
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'module-node'; // 使用新的 CSS 类

                nodeDiv.title = moduleName;

                nodeDiv.innerHTML = `<div class="node-desc">${escapeHtml(moduleName)}</div>`;

                // 高亮当前模块
                if (moduleName === currentModule) {
                    nodeDiv.classList.add('active');
                }

                // 点击跳转
                nodeDiv.onclick = () => {
                    // 如果点击的不是当前模块，则发送跳转命令
                    if (moduleName !== currentModule) {
                        vscode.postMessage({
                            type: 'executeCommand',
                            commandId: 'refinement.switchModule',
                            payload: { moduleName: moduleName }
                        });
                    }
                };

                moduleChainRoot.appendChild(nodeDiv);

                // 添加箭头
                if (index < sequence.length - 1) {
                    const arrowSpan = document.createElement('span');
                    arrowSpan.className = 'arrow';
                    arrowSpan.textContent = '➜';
                    moduleChainRoot.appendChild(arrowSpan);
                }
            });
        }

        // [核心修改] 渲染函数
        // src/extension.ts 中的 renderChain 函数

        function renderChain(nodes) {
            chainRoot.innerHTML = '';

            nodes.forEach((node, index) => {
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'granularity-node';

                // 1. [需求实现] 鼠标悬浮显示全部内容
                // title 属性是 HTML 原生特性，会自动产生一个跟随鼠标的文本提示框
                nodeDiv.title = node.description;

                // 2. [需求实现] 只显示 description，不再显示 "粒度 n"
                // 如果描述为空，为了防止空方块，可以显示一个默认占位符
                const displayText = node.description || ('Step ' + node.index);

                nodeDiv.innerHTML = '<div class="node-desc">' + escapeHtml(displayText) + '</div>';

                if (node.isActive) {
                    nodeDiv.classList.add('active');
                }

                nodeDiv.onclick = () => {
                    vscode.postMessage({
                        type: 'executeCommand',
                        commandId: 'refinement.switchGranularity',
                        payload: { index: index }
                    });
                };

                chainRoot.appendChild(nodeDiv);

                if (index < nodes.length - 1) {
                    const arrowSpan = document.createElement('span');
                    arrowSpan.className = 'arrow';
                    arrowSpan.textContent = '➜';
                    chainRoot.appendChild(arrowSpan);
                }
            });
        }

        function renderButtonBar(nodes, moduleStatus, currentGranularity) {
            // If no active node, hide all buttons.
            const hasActive = nodes.some(node => node.isActive);

            if (!hasActive) {
                updateButtonBar('none', 'none', 'none', 'block');
                buttonBarPending.textContent = 'No selected granularity.';
                return;
            }

            // 找到当前激活的节点
            const activeNodeIndex = nodes.findIndex(node => node.isActive);
            const isLastNode = (activeNodeIndex === nodes.length - 1);

            // 如果用户查看的不是最后一个粒度（即在查看历史粒度），只显示"回退粒度"按钮
            if (!isLastNode) {
                updateButtonBar('none', 'flex', 'none', 'none');
                return;
            }

            // 以下逻辑仅在用户查看最后一个粒度时才执行

            // 如果当前粒度为0、模块状态为ongoing、且是最后一个节点，只显示json2pse按钮
            if (currentGranularity === 0 && moduleStatus === 'ongoing') {
                updateButtonBar('none', 'none', 'flex', 'none');
                return;
            }

            const displayMap = {
                'ongoing':      ['flex', 'none', 'none', 'none'],
                'completed':    ['none', 'flex', 'none', 'none'],
                'pending':      ['none', 'none', 'none', 'block']
            };

            const cfg = displayMap[moduleStatus]
            if (!cfg) {
                console.error(`Invalid module status from backend: ${moduleStatus}.`);
                return;
            } 
            
            updateButtonBar(cfg[0], cfg[1], cfg[2], cfg[3]);

            if (moduleStatus === 'pending') {
                buttonBarPending.textContent = 'Please refine preceding modules first.';
            }
        }

        function updateButtonBar(ongoingBarState, completedBarState, granularity0BarState, pendingBarState) {
            buttonBarOngoing.style.display = ongoingBarState;
            buttonBarCompleted.style.display = completedBarState;
            buttonBarGranularity0.style.display = granularity0BarState;
            buttonBarPending.style.display = pendingBarState;
        }

        // 简单的 HTML 转义函数，防止描述中包含 < > 等特殊字符破坏布局
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        vscode.postMessage({ type: 'webviewReady' });
    </script>
</body>

</html>
