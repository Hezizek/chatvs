<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">
    <title>粒度面板</title>
</head>

<body>
    <div class="mode-bar">
        <span class="mode-label">当前模式：</span>
        <button type="button" id="mode-design" class="mode-btn active" onclick="setMode('design')">设计模式</button>
        <button type="button" id="mode-refine" class="mode-btn" onclick="setMode('refine')">精化模式</button>
    </div>

    <div id="design-workspace" class="module-container">
        <div class="chain-title">设计树（可编辑）</div>
        <div id="editable-tree-root" class="tree-root"></div>
        <div class="sub-title">叶子拓扑顺序（依赖自动排序，只读）</div>
        <div id="leaf-order-root" class="leaf-order-root"></div>
        <div class="tree-hint">说明：设计阶段只改结构。通用数据结构提取是项目级一次性动作，请在左侧项目树执行“完成设计”。</div>
    </div>

    <div class="panel-shell">
        <div id="design-panel" class="panel active">
            <div class="panel-title">设计阶段</div>
            <div id="design-stage-tip" class="panel-hint">
                在上方树中通过“新增/拆分/删除/改描述”完成结构设计。完成后请先在左侧项目树执行“完成设计（提取数据结构 + 生成精化顺序）”，再进入精化阶段。
            </div>
        </div>

        <div id="refine-panel" class="panel">
            <div class="panel-title">精化阶段（执行即保存）</div>
            <div class="toolbar">
                <select id="evolve-template-select" title="选择精化模板" class="refine-level-select" onchange="onTemplateChange()">
                    <option value="globalDetailed" selected>细粒度精化</option>
                    <option value="globalCoarse">粗粒度精化</option>
                    <option value="local">局部精化</option>
                    <option value="generateCode">生成代码</option>
                </select>
                <button type="button" class="btn-icon" title="预览当前模板的系统提示词" onclick="previewCurrentTemplate()">📖</button>
                <!-- 代码语言下拉框：仅在"生成代码"模板时显示 -->
                <select id="language-select" title="选择语言" class="language-select language-select--hidden">
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="c++">C++</option>
                    <option value="c">C</option>
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                    <option value="html">HTML</option>
                </select>
                <input id="evolve-custom-prompt" class="prompt-input" type="text" placeholder="输入精化提示词（可选）" />
                <button type="button" onclick="sendEvolveCommand()">执行</button>
                <button type="button" onclick="sendCommand('refinement.rollback')">回退粒度</button>
                <button type="button" class="btn-confirm" title="完成当前模块精化，推进到下一模块" onclick="confirmDesignAndEvolution()">完成并推进</button>
            </div>
            <div class="panel-hint">精化阶段只关注当前模块内容演进。完成后点击<strong>完成并推进</strong>，当前模块标记为已完成并自动切换到下一待处理模块。</div>
        </div>
    </div>

    <div class="history-container">
        <div class="chain-title">当前模块精化历史</div>
        <div class="granularity-chain" id="chain-root"></div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const chainRoot = document.getElementById('chain-root');
        const editableTreeRoot = document.getElementById('editable-tree-root');
        const leafOrderRoot = document.getElementById('leaf-order-root');
        const designWorkspace = document.getElementById('design-workspace');
        const designStageTip = document.getElementById('design-stage-tip');

        let editableModules = [];
        let currentModuleName = '';
        let currentMode = 'design';
        let projectMeta = { name: 'Project', description: '' };

        function sendCommand(commandId, payload) {
            vscode.postMessage({ type: 'executeCommand', commandId, payload });
        }

        function setMode(mode) {
            currentMode = mode;
            document.body.setAttribute('data-mode', mode);
            document.getElementById('mode-design').classList.toggle('active', mode === 'design');
            document.getElementById('mode-refine').classList.toggle('active', mode === 'refine');
            document.getElementById('design-panel').classList.toggle('active', mode === 'design');
            document.getElementById('refine-panel').classList.toggle('active', mode === 'refine');
            designWorkspace.style.display = mode === 'design' ? 'flex' : 'none';
        }

        function previewCurrentTemplate() {
            const template = document.getElementById('evolve-template-select').value;
            sendCommand('refinement.previewTemplate', { template });
        }

        function onTemplateChange() {
            const template = document.getElementById('evolve-template-select').value;
            const langSelect = document.getElementById('language-select');
            if (template === 'generateCode') {
                langSelect.classList.remove('language-select--hidden');
            } else {
                langSelect.classList.add('language-select--hidden');
            }
        }

        function sendEvolveCommand() {
            const template = document.getElementById('evolve-template-select').value;
            const language = document.getElementById('language-select').value;
            const customPrompt = (document.getElementById('evolve-custom-prompt').value || '').trim();
            sendCommand('refinement.evolve', { template, language, customPrompt });
            setMode('refine');
        }

        function confirmDesignAndEvolution() {
            sendCommand('refinement.confirmEvolution');
        }

        function buildModuleTree(modules) {
            const root = { name: '__root__', fullName: '', children: {} };

            (modules || []).forEach((module) => {
                const nameParts = String(module.name || '').split('.').filter(Boolean);
                let cursor = root;
                let acc = [];
                nameParts.forEach((part, idx) => {
                    acc.push(part);
                    const fullName = acc.join('.');
                    if (!cursor.children[part]) {
                        cursor.children[part] = {
                            name: part,
                            fullName,
                            children: {},
                            module: null
                        };
                    }
                    cursor = cursor.children[part];
                    if (idx === nameParts.length - 1) {
                        cursor.module = module;
                    }
                });
            });

            return root;
        }

        function createRootNode(readonlyMode) {
            const rootNode = document.createElement('div');
            rootNode.className = 'tree-node root-node';
            rootNode.innerHTML = `
                <div class="tree-node-header ${readonlyMode ? 'readonly' : ''}">
                    <div class="tree-node-title">${escapeHtml(projectMeta.name || 'Project')}</div>
                    <span class="root-badge">Root</span>
                </div>
                <div class="tree-node-desc">${escapeHtml(projectMeta.description || '(无项目描述)')}</div>
            `;
            return rootNode;
        }

        function renderTreeNode(node, readonlyMode) {
            const wrapper = document.createElement('div');
            wrapper.className = 'tree-node';

            const hasChildren = Object.keys(node.children).length > 0;
            const module = node.module;
            const isLeafModule = !!module && !hasChildren;
            const desc = module ? (module.description || '') : '';
            const status = module ? (module.status || 'pending') : '';

            const header = document.createElement('div');
            header.className = 'tree-node-header';
            if (module && module.name === currentModuleName) {
                header.classList.add('active');
            }

            if (module) {
                header.style.cursor = 'pointer';
                header.onclick = () => {
                    currentModuleName = module.name;
                    renderTree(editableTreeRoot, editableModules, false, '(当前无可编辑模块)');
                    renderLeafOrderEditor();
                    sendCommand('refinement.switchModule', { modulePath: module.path });
                };
            }

            const title = document.createElement('div');
            title.className = 'tree-node-title';
            title.textContent = node.fullName || node.name;
            header.appendChild(title);

            if (module) {
                const badge = document.createElement('span');
                badge.className = `status-badge status-${escapeHtml(status)}`;
                badge.textContent = status;
                header.appendChild(badge);
            }

            wrapper.appendChild(header);

            if (module) {
                const descDiv = document.createElement('div');
                descDiv.className = 'tree-node-desc';
                descDiv.textContent = desc || '(无描述)';
                wrapper.appendChild(descDiv);
            }

            if (!readonlyMode && module) {
                const actions = document.createElement('div');
                actions.className = 'tree-actions';

                if (!isLeafModule) {
                    const createBtn = document.createElement('button');
                    createBtn.className = 'mini-btn';
                    createBtn.title = '新增子模块';
                    createBtn.textContent = '新增';
                    createBtn.onclick = () => {
                        const moduleName = (window.prompt(`新增 ${module.name} 的子模块名称`) || '').trim();
                        if (!moduleName) return;
                        const moduleDescription = (window.prompt(`新增模块 ${moduleName} 的描述（可选）`) || '').trim();
                        sendCommand('refinement.createChildModuleByPath', {
                            modulePath: module.path,
                            moduleName,
                            moduleDescription
                        });
                    };
                    actions.appendChild(createBtn);
                }

                if (isLeafModule) {
                    const splitBtn = document.createElement('button');
                    splitBtn.className = 'mini-btn';
                    splitBtn.title = '将该模块拆分为子模块';
                    splitBtn.textContent = '拆分';
                    splitBtn.onclick = () => {
                        const customPrompt = (window.prompt(`输入 ${module.name} 的拆分提示词（可选）`) || '').trim();
                        sendCommand('refinement.splitModuleByPath', { modulePath: module.path, customPrompt });
                    };
                    actions.appendChild(splitBtn);
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'mini-btn';
                deleteBtn.title = '删除该模块节点';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = () => {
                    const ok = window.confirm(`确认删除模块 ${module.name} 及其子结构吗？`);
                    if (!ok) return;
                    sendCommand('refinement.deleteModuleByPath', { modulePath: module.path });
                };
                actions.appendChild(deleteBtn);

                const editBtn = document.createElement('button');
                editBtn.className = 'mini-btn';
                editBtn.textContent = '改描述';
                editBtn.onclick = () => {
                    const newDesc = window.prompt(`编辑 ${module.name} 的描述`, module.description || '');
                    if (newDesc === null) return;
                    sendCommand('refinement.updateModuleDescriptionByPath', {
                        modulePath: module.path,
                        description: newDesc
                    });
                };
                actions.appendChild(editBtn);

                wrapper.appendChild(actions);
            }

            if (hasChildren) {
                const childrenWrap = document.createElement('div');
                childrenWrap.className = 'tree-children';
                const sortedChildren = Object.values(node.children)
                    .sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'))
                sortedChildren.forEach((child, childIndex) => {
                    const childNode = renderTreeNode(child, readonlyMode)
                    const branch = document.createElement('div')
                    branch.className = 'tree-branch'
                    if (childIndex === sortedChildren.length - 1) {
                        branch.classList.add('last')
                    }
                    branch.appendChild(childNode)
                    childrenWrap.appendChild(branch)
                });
                wrapper.appendChild(childrenWrap);
            }

            return wrapper;
        }

        function renderTree(rootEl, modules, readonlyMode, emptyText) {
            rootEl.innerHTML = '';
            rootEl.appendChild(createRootNode(readonlyMode));

            if (!modules || modules.length === 0) {
                const tip = document.createElement('span');
                tip.className = 'empty-tip';
                tip.textContent = emptyText;
                rootEl.appendChild(tip);
                return;
            }

            const tree = buildModuleTree(modules);
            const branch = document.createElement('div');
            branch.className = 'tree-children';
            const sortedChildren = Object.values(tree.children)
                .sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'))
            sortedChildren.forEach((child, childIndex) => {
                const childNode = renderTreeNode(child, readonlyMode)
                const childBranch = document.createElement('div')
                childBranch.className = 'tree-branch'
                if (childIndex === sortedChildren.length - 1) {
                    childBranch.classList.add('last')
                }
                childBranch.appendChild(childNode)
                branch.appendChild(childBranch)
            });
            rootEl.appendChild(branch);
        }

        // 拓扑顺序为只读列表，顺序由后端依赖关系自动计算，不支持手动拖拽
        function renderLeafOrderEditor() {
            leafOrderRoot.innerHTML = '';
            if (!editableModules || editableModules.length === 0) {
                leafOrderRoot.innerHTML = '<span class="empty-tip">(尚无叶子模块)</span>';
                return;
            }

            editableModules.forEach((module, index) => {
                const row = document.createElement('div');
                row.className = 'leaf-row';

                if (module.name === currentModuleName) {
                    row.classList.add('active');
                }

                row.innerHTML = `
                    <span class="leaf-row-index">${index + 1}.</span>
                    <div class="leaf-row-body">
                        <div class="leaf-row-title">${escapeHtml(module.name)}</div>
                        <div class="leaf-row-desc">${escapeHtml(module.description || '')}</div>
                    </div>
                `;

                leafOrderRoot.appendChild(row);
            });
        }

        function renderChain(nodes) {
            chainRoot.innerHTML = '';
            nodes.forEach((node, index) => {
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'granularity-node';
                nodeDiv.title = node.description;
                nodeDiv.innerHTML = '<div class="node-desc center">' + escapeHtml(node.description || ('Step ' + node.index)) + '</div>';

                if (node.isActive) {
                    nodeDiv.classList.add('active');
                }

                nodeDiv.onclick = () => sendCommand('refinement.switchGranularity', { index });
                chainRoot.appendChild(nodeDiv);
            });
        }

        function updateModeAvailability(moduleStatus, designReady) {
            const designBtn = document.getElementById('mode-design');
            const refineBtn = document.getElementById('mode-refine');
            const canRefine = !!designReady && moduleStatus !== 'pending';
            refineBtn.disabled = !canRefine;
            designBtn.disabled = false;

            if (!designReady) {
                designStageTip.textContent = '尚未完成设计收尾：请在左侧项目树执行“完成设计（提取数据结构 + 生成精化顺序）”，随后再进入精化。';
            } else {
                designStageTip.textContent = '设计收尾已完成，可以切换到精化模式逐模块执行；精化确认按钮在精化面板内。';
            }

            if (!canRefine && currentMode === 'refine') {
                setMode('design');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (msg.type !== 'updateView') {
                return;
            }

            const {
                nodes,
                moduleSequence,
                projectName,
                projectDescription,
                currentModule,
                moduleStatus,
                designReady,
                moduleNotFound
            } = msg.data;

            projectMeta = {
                name: projectName || 'Project',
                description: projectDescription || ''
            };
            currentModuleName = currentModule || '';
            editableModules = moduleSequence || [];

            updateModeAvailability(moduleStatus || 'pending', !!designReady);
            renderTree(editableTreeRoot, editableModules, false, '(当前无可编辑模块)');
            renderLeafOrderEditor();
            renderChain(nodes || []);

            // 若模块已被拆分或不存在，显示提示信息
            if (moduleNotFound) {
                chainRoot.innerHTML = '<span class="empty-tip">当前模块已被拆分，请在左侧树中选择子模块继续操作。</span>';
            }
        });

        setMode('design');
        vscode.postMessage({ type: 'webviewReady' });
    </script>
</body>

</html>
